name: ML Continuous Integration and Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Install dependencies
        run: make install

      - name: Check formatting
        run: make format

      - name: Train model
        run: make train

      - name: Generate evaluation report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "# Model Evaluation"
            echo
            cat results/metrics.txt
            echo
            echo "## Confusion Matrix"
            echo
            echo "![Confusion Matrix](./results/confusion_matrix.png)"
          } > report.md
          cat report.md >> $GITHUB_STEP_SUMMARY
          cml comment create --pr=false report.md

      - name: Deploy to Hugging Face Static Space
        if: github.event_name != 'pull_request'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          python -m pip install --upgrade "huggingface_hub[cli]"
          export PATH="$(python -m site --user-base)/bin:$PATH"

          if command -v hf >/dev/null 2>&1; then
            HF_CLI="hf"
          elif command -v huggingface-cli >/dev/null 2>&1; then
            HF_CLI="huggingface-cli"
          else
            echo "Error: Neither 'hf' nor 'huggingface-cli' found after installation." >&2
            exit 1
          fi

          echo "Using Hugging Face CLI: $HF_CLI"

          if [ "$HF_CLI" = "hf" ]; then
            hf auth login --token "$HF_TOKEN"
          else
            huggingface-cli login --token "$HF_TOKEN"
          fi

          $HF_CLI upload "$HF_SPACE_ID" app/ . \
            --repo-type space \
            --commit-message "Deploy static app"
          $HF_CLI upload "$HF_SPACE_ID" model/ model \
            --repo-type space \
            --commit-message "Upload trained model"
          $HF_CLI upload "$HF_SPACE_ID" results/ results \
            --repo-type space \
            --commit-message "Upload evaluation results"

