name: ML Continuous Integration and Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Install dependencies
        run: make install

      - name: Check formatting
        run: make format

      - name: Train model
        run: make train

      - name: Generate evaluation report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "# Model Evaluation"
            echo
            cat results/metrics.txt
            echo
            echo "## Confusion Matrix"
            echo
            echo "![Confusion Matrix](./results/confusion_matrix.png)"
          } > report.md
          cat report.md >> $GITHUB_STEP_SUMMARY
          cml comment create --pr=false report.md || echo "::warning::CML commit comment creation skipped or failed. Report successfully published to GitHub Step Summary."

      - name: Deploy to Hugging Face Static Space
        if: github.event_name != 'pull_request'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          # Clean whitespace, newlines, and carriage returns from secrets
          HF_TOKEN="$(echo "$HF_TOKEN" | tr -d '\r\n[:space:]')"
          HF_SPACE_ID="$(echo "$HF_SPACE_ID" | tr -d '\r\n[:space:]')"
          export HF_TOKEN
          export HF_SPACE_ID

          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Secret 'HF_TOKEN' is missing or not configured in repository secrets."
            exit 1
          fi

          if [ -z "$HF_SPACE_ID" ]; then
            echo "::error::Secret 'HF_SPACE_ID' is missing or not configured in repository secrets."
            exit 1
          fi

          python -m pip install --upgrade "huggingface_hub"
          export PATH="$(python -m site --user-base)/bin:$PATH"

          if command -v hf >/dev/null 2>&1; then
            HF_CLI="hf"
          elif command -v huggingface-cli >/dev/null 2>&1; then
            HF_CLI="huggingface-cli"
          else
            HF_CLI="python -m huggingface_hub.cli.hf"
          fi

          echo "Using Hugging Face CLI: $HF_CLI"

          if [ "$HF_CLI" = "hf" ]; then
            hf auth login --token "$HF_TOKEN" || true
          elif [ "$HF_CLI" = "huggingface-cli" ]; then
            huggingface-cli login --token "$HF_TOKEN" || true
          else
            python -m huggingface_hub.cli.hf auth login --token "$HF_TOKEN" || true
          fi

          $HF_CLI upload "$HF_SPACE_ID" app/ . \
            --repo-type space \
            --commit-message "Deploy static app" \
            --token "$HF_TOKEN"
          $HF_CLI upload "$HF_SPACE_ID" model/ model \
            --repo-type space \
            --commit-message "Upload trained model" \
            --token "$HF_TOKEN"
          $HF_CLI upload "$HF_SPACE_ID" results/ results \
            --repo-type space \
            --commit-message "Upload evaluation results" \
            --token "$HF_TOKEN"

